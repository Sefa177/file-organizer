[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sefa177-file-organizer"
version = "0.1.1"
description = "A tiny CLI that sorts a messy folder (like Downloads) into category subfolders, with dry-run and undo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sefa177" }]
keywords = ["cli", "files", "organizer", "downloads", "cleanup", "sort"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Sefa177/file-organizer"
Issues = "https://github.com/Sefa177/file-organizer/issues"

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.setuptools]
packages = ["file_organizer"]
