[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sefa177-file-organizer"
version = "0.1.0"
description = "A tiny CLI that sorts a messy folder (like Downloads) into category subfolders, with dry-run and undo."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sefa177" }]
keywords = ["cli", "files", "organizer", "downloads", "cleanup", "sort"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Sefa177/file-organizer"
Issues = "https://github.com/Sefa177/file-organizer/issues"

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.setuptools]
packages = ["file_organizer"]
